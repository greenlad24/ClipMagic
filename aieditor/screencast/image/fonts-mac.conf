<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Screencast recorder: look like Chrome on macOS (Jake 2026-10-08: "it should be acting like a real
     chrome on Mac not chromium"). Apple's SF fonts are licensed for Apple platforms only, so the Mac
     names are aliased to close open matches: SF Pro / system UI → Inter, Helvetica/Arial → Liberation
     Sans (metric-compatible), SF Mono / Menlo / Monaco → JetBrains Mono, emoji → Noto Color Emoji
     (Apple Color Emoji is not available). DejaVu never wins a generic family. -->
<fontconfig>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>.AppleSystemUIFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>ui-monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Monaco</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Apple Color Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Liberation Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <!-- macOS renders without hinting, greyscale antialiasing -->
  <match target="font"><edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit></match>
</fontconfig>
